<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Emotion Scanner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  :root {
    --void: #07030F;
    --panel: rgba(18, 8, 40, .72);
    --cyan: #00F0FF;
    --pink: #FF2BD6;
    --text: #D9D2F5;
    --accent: var(--cyan);
    --display: "Orbitron", "Arial Black", sans-serif;
    --body: "Rajdhani", system-ui, sans-serif;
    --mono: "Share Tech Mono", ui-monospace, monospace;
  }
  body[data-mood="anger"]   { --accent: #FF2A55; }
  body[data-mood="disgust"] { --accent: #B6FF00; }
  body[data-mood="fear"]    { --accent: #A855FF; }
  body[data-mood="joy"]     { --accent: #FFE600; }
  body[data-mood="sadness"] { --accent: #00C8FF; }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(ellipse at 50% -10%, #2A0F5E 0%, var(--void) 60%);
    color: var(--text);
    font-family: var(--body);
    font-size: 1.15rem;
    font-weight: 500;
    overflow-x: hidden;
  }

  /* moving grid floor + scanlines */
  .floor {
    position: fixed; left: -50%; right: -50%; bottom: 0; height: 55vh;
    background-image:
      linear-gradient(var(--accent) 1px, transparent 1px),
      linear-gradient(90deg, var(--accent) 1px, transparent 1px);
    background-size: 60px 60px;
    transform: perspective(320px) rotateX(62deg);
    transform-origin: bottom;
    opacity: .22;
    animation: floor 2.4s linear infinite;
    -webkit-mask-image: linear-gradient(to top, #000 10%, transparent 90%);
            mask-image: linear-gradient(to top, #000 10%, transparent 90%);
    transition: background-image .6s;
    pointer-events: none;
  }
  @keyframes floor { to { background-position: 0 60px; } }
  body::after {
    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 5;
    background: repeating-linear-gradient(to bottom, rgba(0,0,0,.18) 0 1px, transparent 1px 3px);
  }

  .wrap { position: relative; z-index: 2; max-width: 1100px; margin: 0 auto; padding: 1.2rem 1.4rem 4rem; }

  header {
    display: flex; justify-content: space-between; align-items: center;
    border-bottom: 1px solid rgba(0, 240, 255, .35);
    padding-bottom: .8rem; margin-bottom: 2.4rem;
    font-family: var(--mono); font-size: .9rem; color: var(--cyan);
  }
  .status::before {
    content: ""; display: inline-block; width: .55rem; height: .55rem; margin-right: .5rem;
    background: #3DFF8B; border-radius: 50%; box-shadow: 0 0 10px #3DFF8B;
    animation: blink 1.4s infinite;
  }
  @keyframes blink { 50% { opacity: .25; } }

  /* glitch text */
  .glitch { position: relative; display: inline-block; }
  .glitch::before, .glitch::after {
    content: attr(data-text); position: absolute; inset: 0; overflow: hidden;
  }
  .glitch::before { color: var(--pink); transform: translateX(-3px); clip-path: inset(0 0 60% 0); animation: gl1 3s infinite steps(1); }
  .glitch::after  { color: var(--cyan); transform: translateX(3px);  clip-path: inset(60% 0 0 0); animation: gl2 3s infinite steps(1); }
  @keyframes gl1 { 0%,90%,100% { clip-path: inset(0 0 100% 0); } 92% { clip-path: inset(10% 0 55% 0); } 96% { clip-path: inset(40% 0 30% 0); } }
  @keyframes gl2 { 0%,88%,100% { clip-path: inset(100% 0 0 0); } 90% { clip-path: inset(55% 0 20% 0); } 95% { clip-path: inset(75% 0 5% 0); } }

  h1 {
    font-family: var(--display); font-weight: 900;
    font-size: clamp(2rem, 6.5vw, 4.4rem); line-height: 1; letter-spacing: .02em;
    margin: 0 0 .6rem; color: #fff; text-shadow: 0 0 22px rgba(0, 240, 255, .55);
  }
  .sub { margin: 0 0 2.2rem; max-width: 46ch; opacity: .85; }

  .grid { display: grid; grid-template-columns: 1fr 1.1fr; gap: 1.6rem; align-items: start; }

  /* HUD panel with cut corners */
  .panel {
    position: relative; background: var(--panel); backdrop-filter: blur(6px);
    border: 1px solid color-mix(in srgb, var(--accent) 55%, transparent);
    padding: 1.4rem;
    clip-path: polygon(0 0, calc(100% - 22px) 0, 100% 22px, 100% 100%, 22px 100%, 0 calc(100% - 22px));
    box-shadow: inset 0 0 40px color-mix(in srgb, var(--accent) 10%, transparent);
    transition: border-color .5s;
  }
  .tag { font-family: var(--mono); font-size: .85rem; color: var(--accent); margin: 0 0 .9rem; transition: color .5s; }

  textarea {
    width: 100%; min-height: 10rem; resize: vertical;
    background: rgba(0, 0, 0, .45); color: #fff;
    border: 1px solid rgba(0, 240, 255, .4);
    font-family: var(--mono); font-size: 1.15rem; line-height: 1.5; padding: .9rem;
    caret-color: var(--pink);
  }
  textarea::placeholder { color: rgba(217, 210, 245, .4); }
  textarea:focus { outline: none; border-color: var(--pink); box-shadow: 0 0 18px rgba(255, 43, 214, .45); }

  .go {
    margin-top: 1rem; width: 100%;
    font-family: var(--display); font-weight: 700; font-size: 1rem; letter-spacing: .12em;
    color: var(--void); background: var(--cyan); border: 0; padding: 1rem 1.2rem; cursor: pointer;
    clip-path: polygon(0 0, calc(100% - 14px) 0, 100% 14px, 100% 100%, 14px 100%, 0 calc(100% - 14px));
    transition: background .2s, box-shadow .2s, transform .15s;
    box-shadow: 0 0 24px rgba(0, 240, 255, .5);
  }
  .go:hover { background: var(--pink); box-shadow: 0 0 28px rgba(255, 43, 214, .65); }
  .go:active { transform: scale(.98); }
  .go:disabled { opacity: .7; cursor: progress; }
  button:focus-visible, textarea:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }

  .presets { display: flex; flex-wrap: wrap; gap: .5rem; margin-top: 1.1rem; }
  .presets button {
    font-family: var(--mono); font-size: .85rem; color: var(--cyan); background: transparent;
    border: 1px dashed rgba(0, 240, 255, .6); padding: .3rem .7rem; cursor: pointer;
  }
  .presets button:hover { background: rgba(0, 240, 255, .12); }

  /* output */
  .radar { display: block; width: 100%; max-width: 330px; margin: 0 auto; overflow: visible; }
  .radar .ring { fill: none; stroke: rgba(217, 210, 245, .18); }
  .radar .axis { stroke: rgba(217, 210, 245, .18); }
  .radar text { font-family: var(--mono); font-size: 8px; fill: var(--text); }
  .radar polygon { fill: color-mix(in srgb, var(--accent) 30%, transparent); stroke: var(--accent); stroke-width: 1.5;
    filter: drop-shadow(0 0 5px var(--accent)); transition: all .9s cubic-bezier(.2,.8,.2,1); }

  .verdict {
    font-family: var(--display); font-weight: 900; text-transform: uppercase;
    font-size: clamp(2.2rem, 7vw, 3.8rem); line-height: 1.05; margin: 1rem 0 .2rem;
    color: var(--accent); text-shadow: 0 0 20px var(--accent); transition: color .5s;
    word-break: break-word;
  }
  .verdict-note { font-family: var(--mono); font-size: .9rem; margin: 0 0 1.2rem; opacity: .8; }

  .bar { display: grid; grid-template-columns: 5.6rem 1fr 3.4rem; gap: .7rem; align-items: center; margin: .5rem 0; font-family: var(--mono); font-size: .95rem; }
  .track { height: .7rem; background: rgba(255, 255, 255, .08); position: relative; }
  .fill { height: 100%; width: 0; background: var(--c); box-shadow: 0 0 10px var(--c); transition: width 1s cubic-bezier(.2,.8,.2,1); }
  .bar.top .name { color: var(--c); }
  .val { text-align: right; }

  .idle, .message { font-family: var(--mono); margin: 1rem 0 0; text-align: center; }
  .message { color: #FF5A7A; text-align: left; }
  .loading { font-family: var(--mono); color: var(--cyan); margin: 1rem 0 0; }
  .loading i { display: block; height: 3px; margin-top: .6rem; background: linear-gradient(90deg, transparent, var(--cyan), transparent); background-size: 40% 100%; background-repeat: no-repeat; animation: sweep 1s linear infinite; }
  @keyframes sweep { from { background-position: -40% 0; } to { background-position: 140% 0; } }

  @media (max-width: 820px) { .grid { grid-template-columns: 1fr; } }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body data-mood="neutral">
<div class="floor"></div>
<div class="wrap">
  <header>
    <span>EMOTION.SYS // v1.0</span>
    <span class="status">online</span>
  </header>

  <h1 class="glitch" data-text="Emotion Scanner">Emotion Scanner</h1>
  <p class="sub">Type a sentence. The scanner reads the feeling inside it and measures anger, disgust, fear, joy and sadness.</p>

  <div class="grid">
    <section class="panel">
      <p class="tag">&gt; input</p>
      <textarea id="text_to_analyze" aria-label="Sentence to scan" placeholder="Type a sentence to scan…" autofocus></textarea>
      <button class="go" id="go" type="button">RUN SCAN</button>
      <div class="presets" aria-label="Example sentences">
        <button type="button" data-t="I am so happy and excited about this">joy</button>
        <button type="button" data-t="I am really mad about what they did">anger</button>
        <button type="button" data-t="I am really afraid that this will happen">fear</button>
        <button type="button" data-t="I feel disgusted just hearing about this">disgust</button>
        <button type="button" data-t="I am so sad and lonely today">sadness</button>
      </div>
    </section>

    <section class="panel" aria-live="polite">
      <p class="tag">&gt; output</p>
      <div id="result"></div>
    </section>
  </div>
</div>

<script>
  const EMOTIONS = ["anger", "disgust", "fear", "joy", "sadness"];
  const COLORS = { anger: "#FF2A55", disgust: "#B6FF00", fear: "#A855FF", joy: "#FFE600", sadness: "#00C8FF" };
  const input = document.getElementById("text_to_analyze");
  const button = document.getElementById("go");
  const result = document.getElementById("result");

  function pct(v) { const p = v * 100; return p < 0.1 ? "<0.1%" : p.toFixed(p < 10 ? 1 : 0) + "%"; }

  function radar(scores) {
    const c = 100, R = 70;
    const pt = (i, k) => {
      const a = (-90 + i * 72) * Math.PI / 180;
      return [c + Math.cos(a) * R * k, c + Math.sin(a) * R * k];
    };
    const ring = k => EMOTIONS.map((_, i) => pt(i, k).join(",")).join(" ");
    const poly = EMOTIONS.map((e, i) => pt(i, scores ? 0.06 + 0.94 * scores[e] : 0.06).join(",")).join(" ");
    const axes = EMOTIONS.map((e, i) => {
      const [x, y] = pt(i, 1), [lx, ly] = pt(i, 1.2);
      const anchor = lx < c - 5 ? "end" : lx > c + 5 ? "start" : "middle";
      return `<line class="axis" x1="${c}" y1="${c}" x2="${x}" y2="${y}"/>
              <text x="${lx}" y="${ly + 3}" text-anchor="${anchor}">${e}</text>`;
    }).join("");
    return `<svg class="radar" viewBox="-20 -5 240 215" role="img" aria-label="Emotion radar chart">
      <polygon class="ring" points="${ring(1)}"/><polygon class="ring" points="${ring(.66)}"/><polygon class="ring" points="${ring(.33)}"/>
      ${axes}<polygon points="${poly}"/></svg>`;
  }

  function showIdle() {
    document.body.dataset.mood = "neutral";
    result.innerHTML = radar(null) + `<p class="idle">Waiting for input…</p>`;
  }

  function showMessage(text) {
    document.body.dataset.mood = "neutral";
    result.innerHTML = radar(null);
    const p = document.createElement("p");
    p.className = "message";
    p.textContent = "! " + text;
    result.appendChild(p);
  }

  function showResult(raw) {
    const dominant = (raw.match(/dominant emotion is (\w+)/) || [])[1];
    const scores = {};
    for (const m of raw.matchAll(/'(\w+)':\s*([0-9.eE+-]+)/g)) scores[m[1]] = parseFloat(m[2]);
    if (!dominant || !EMOTIONS.every(e => e in scores)) { showMessage(raw.trim() || "Something went wrong. Try again."); return; }

    document.body.dataset.mood = dominant;
    const bars = EMOTIONS.map(e => `
      <div class="bar ${e === dominant ? "top" : ""}" style="--c:${COLORS[e]}">
        <span class="name">${e}</span>
        <span class="track"><span class="fill" data-w="${(scores[e] * 100).toFixed(2)}"></span></span>
        <span class="val">${pct(scores[e])}</span>
      </div>`).join("");
    result.innerHTML = radar(scores) +
      `<h2 class="verdict glitch" data-text="${dominant}">${dominant}</h2>
       <p class="verdict-note">strongest emotion detected</p>${bars}`;
    requestAnimationFrame(() => requestAnimationFrame(() =>
      result.querySelectorAll(".fill").forEach(f => f.style.width = f.dataset.w + "%")));
  }

  async function run() {
    const text = input.value;
    if (!text.trim()) { showMessage("Invalid text! Please type a sentence first."); input.focus(); return; }
    button.disabled = true;
    button.textContent = "SCANNING…";
    result.innerHTML = radar(null) + `<p class="loading">Reading emotional signal…<i></i></p>`;
    try {
      const res = await fetch("/emotionDetector?textToAnalyze=" + encodeURIComponent(text));
      const raw = await res.text();
      await new Promise(r => setTimeout(r, 450));
      showResult(raw);
    } catch (err) {
      showMessage("Could not reach the server. Make sure server.py is running.");
    } finally {
      button.disabled = false;
      button.textContent = "RUN SCAN";
    }
  }

  button.addEventListener("click", run);
  input.addEventListener("keydown", e => { if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) run(); });
  document.querySelectorAll(".presets button").forEach(b =>
    b.addEventListener("click", () => { input.value = b.dataset.t; run(); }));
  showIdle();
</script>
</body>
</html>
